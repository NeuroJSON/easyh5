name: EasyH5 CI

on: [push, pull_request]

jobs:
  octave_test:
    name: Octave tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    # a guard against a step hanging: without it a stuck build sits on a runner
    # until the six hour default limit
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install Octave
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # octave-dev provides mkoctfile, which is needed to build oct-hdf5.
            # It used to be called liboctave-dev, a name that no longer exists
            # in Ubuntu 24.04; octave-dev is published in both 22.04 and 24.04.
            # These packages are in the universe component, so enable it first
            sudo add-apt-repository -y universe
            sudo apt-get update
            # no MPI package is needed: the Debian/Ubuntu Octave reports
            # "HDF5_LIBS: -lhdf5 -lmpi" even though its HDF5 paths point at the
            # serial build, and oct-hdf5 used to pass that through verbatim.
            # Since tag git20260830 it drops -lmpi when libmpi is not linkable
            sudo apt-get install -y octave octave-dev libhdf5-dev
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install octave hdf5
          else
            curl --retry 3 -kL https://mirrors.ocf.berkeley.edu/gnu/octave/windows/octave-9.2.0-w64-64.7z --output octave.7z
            7z x octave.7z -ooctave -y
            echo "$PWD/octave/octave-9.2.0-w64-64/mingw64/bin" >> $GITHUB_PATH
          fi
      - name: Install oct-hdf5
        if: ${{ runner.os != 'Windows' }}
        timeout-minutes: 10
        run: |
          octave-cli --eval "pkg install https://github.com/NeuroJSON/oct-hdf5/archive/refs/tags/git20260830.zip"
      - name: Install oct-hdf5 (Windows)
        # letting "pkg install <url>" do its own download hangs here with no
        # output at all, never reaching the build, so the archive is fetched
        # with curl first and pkg is handed a local file. Still best effort:
        # if the build itself is also a problem the suite skips the HDF5 tests
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 10
        continue-on-error: true
        run: |
          curl --retry 3 -kL https://github.com/NeuroJSON/oct-hdf5/archive/refs/tags/git20260830.zip --output oct-hdf5.zip
          ls -l oct-hdf5.zip
          octave-cli --eval "pkg install -verbose oct-hdf5.zip"
      - name: Confirm the HDF5 backend is usable
        # without this the suite would skip its HDF5 tests and still report
        # success, so a broken backend has to fail the job here
        if: ${{ runner.os != 'Windows' }}
        run: |
          octave-cli --eval "pkg load oct-hdf5; disp('oct-hdf5 loaded')"
      - name: Report whether the HDF5 backend is available
        if: ${{ runner.os == 'Windows' }}
        run: |
          octave-cli --eval "try; pkg load oct-hdf5; disp('oct-hdf5 loaded'); catch; disp('oct-hdf5 NOT available, the HDF5 tests will skip'); end"
      - name: Run unit tests
        # the load is tolerant here because the step above already fails the
        # job when the backend is missing on the platforms that require it
        run: |
          octave-cli --eval "try; pkg load oct-hdf5; catch; end; addpath(pwd); cd test; run_easyh5_test"
      - name: Run the demo script
        run: |
          octave-cli --eval "try; pkg load oct-hdf5; catch; end; addpath(pwd); cd examples; demo_eazyh5_basic"
      - name: Verify the Octave package builds and installs
        if: ${{ runner.os == 'Linux' }}
        run: |
          ./mkpkg.sh
          octave-cli --eval "pkg install easyh5-*.tar.gz; pkg load easyh5; disp(which('saveh5')); pkg uninstall easyh5"

  matlab_test:
    name: MATLAB test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up MATLAB
        # R2022a is the release the other NeuroJSON toolboxes pin to
        if: ${{ matrix.os != 'macos-14' }}
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2022a
      - name: Set up MATLAB (Apple silicon)
        # R2022a has no Apple silicon build, R2023b is the first one that does
        if: ${{ matrix.os == 'macos-14' }}
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b
      - name: Run MATLAB unit tests
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(pwd); cd test; run_easyh5_test
      - name: Run MATLAB demo script
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(pwd); cd examples; demo_eazyh5_basic
